name: Deploy to Environment

on:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Maps branch to GitHub Environments (Settings > Environments)
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'dev' && 'development' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pre-flight Variable Check
        run: |
          echo "🚀 Target Environment: ${{ github.ref_name }}"
          if [ -z "${{ vars.DEPLOY_HOST }}" ]; then echo "❌ DEPLOY_HOST is missing"; exit 1; fi
          if [ -z "${{ vars.DEPLOY_PATH }}" ]; then echo "❌ DEPLOY_PATH is missing"; exit 1; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then echo "❌ SSH_PRIVATE_KEY secret is missing"; exit 1; fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Replace placeholders
        run: |
          DEPLOY_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s|__SITE_TITLE__|${{ vars.SITE_TITLE }}|g" index.html
          sed -i "s|__SITE_COLOR__|${{ vars.SITE_COLOR }}|g" style.css
          sed -i "s|__DEPLOY_TIME__|${DEPLOY_TIME}|g" index.html
          sed -i "s|__COMMIT_SHA__|${COMMIT_SHA}|g" index.html
          sed -i "s|__SITE_TITLE__|${{ vars.SITE_TITLE }}|g" app.js

      - name: Copy files to EC2
        run: |
          # The trailing slash on DEPLOY_PATH ensures files go INSIDE the folder
          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              index.html style.css app.js \
              ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/

      - name: Fix Permissions & Restart Nginx
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
              "sudo chown -R www-data:www-data ${{ vars.DEPLOY_PATH }} && sudo chmod -R 755 ${{ vars.DEPLOY_PATH }} && sudo systemctl restart nginx"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
              "ls -la ${{ vars.DEPLOY_PATH }}"
